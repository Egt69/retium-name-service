# This workspace is a copy of the parts of the Retium SDK workspace that the
# RNS v3 contract needs, with the same directory layout.
#
# That layout is not cosmetic. Cargo passes workspace members' sources to rustc
# as paths relative to the workspace root, and those paths end up in the wasm
# (panic locations and, indirectly, symbol ordering). Building from
# `crates/retium-contract` and `examples/rns_v3` is what makes the output match
# the deployed bytes; renaming either directory changes the code hash.
[workspace]
resolver = "2"
members = ["crates/retium-contract", "examples/rns_v3"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Retium-Org/retium-sdk"
homepage = "https://retium.org"
authors = ["Retium"]

[workspace.dependencies]
retium-contract = { version = "0.2.0", path = "crates/retium-contract" }

# Contracts are hashed as deployed, so builds must be small and deterministic.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
